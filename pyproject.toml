[project]
name = "audio-transcriber"
version = "0.1.0"
description = "Async mp3/wav/mp4/mov/avi transcription module with OpenAI and mp3 chunking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
